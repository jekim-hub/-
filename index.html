<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>워크샵 · 말랑 파스텔</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
  :root{
    /* 강아지 털색(아프리콧)에 맞춘 크림 · 살구 · 모래 팔레트 */
    --card:#ffffff;
    --ink:#4a3a30; --muted:#9c8b7a;
    --apricot:#e2a06d; --apricot-soft:#ffe7d1;
    --sand:#d8bf94;   --sand-soft:#f6ecd9;
    --cocoa:#a9713f;
    --shadow:0 10px 0 -4px rgba(226,160,109,.16), 0 18px 40px -22px rgba(120,85,55,.42);
  }
  *{box-sizing:border-box}
  body{
    margin:0; color:var(--ink); min-height:100vh;
    font-family:"IBM Plex Sans KR","Malgun Gothic",sans-serif; font-size:15px; line-height:1.65;
    /* 위쪽 크림빛에서 아래쪽 살구빛으로 흐르는 그라데이션 */
    background:
      radial-gradient(1000px 620px at 50% -14%, rgba(255,255,255,.8) 0%, rgba(255,255,255,0) 62%),
      linear-gradient(165deg, #fff8f0 0%, #ffeeda 30%, #ffdcbc 62%, #f6dfc8 82%, #efe4d6 100%);
    background-attachment:fixed;
  }
  .wrap{max-width:780px;margin:0 auto;padding:52px 20px 90px;}

  /* ---- Hero: 우리집 강아지 ---- */
  .hero{text-align:center;margin-bottom:36px;}
  .mascot{
    position:relative;width:168px;height:168px;margin:0 auto 14px;
    display:grid;place-items:center;
    animation:bob 4.5s ease-in-out infinite;
  }
  .mascot::before{
    content:"";position:absolute;inset:8px;
    background:radial-gradient(circle at 42% 34%, #fff7ec 0%, #ffe8d0 62%, #ffdcbb 100%);
    border-radius:52% 48% 44% 56% / 50% 42% 58% 50%;
    box-shadow:0 16px 34px -18px rgba(190,120,70,.55);
  }
  .mascot svg{position:relative;width:154px;height:154px;display:block;}
  @keyframes bob{50%{transform:translateY(-8px) rotate(-2deg)}}
  .spk{animation:tw 2.6s ease-in-out infinite;transform-origin:center;}
  .spk.s2{animation-delay:1.1s}
  @keyframes tw{0%,100%{opacity:.3}50%{opacity:1}}
  @media (prefers-reduced-motion: reduce){ .mascot,.spk{animation:none} }

  h1{font-family:"Jua",sans-serif;font-weight:400;font-size:clamp(26px,5vw,34px);margin:0 0 6px;letter-spacing:.01em;}
  .hero p{margin:0;color:var(--muted);font-size:14px;}

  /* ---- 목록 ---- */
  .grid{display:grid;gap:16px;}
  .item{
    display:flex;align-items:center;gap:16px;text-decoration:none;color:inherit;
    background:var(--card);border-radius:22px;padding:20px 22px;
    box-shadow:var(--shadow); transition:transform .18s cubic-bezier(.34,1.56,.64,1), box-shadow .18s;
  }
  .item:hover{transform:translateY(-4px) scale(1.012);box-shadow:0 14px 0 -4px rgba(226,160,109,.22),0 26px 50px -24px rgba(120,85,55,.45);}
  .ico{flex:none;width:56px;height:56px;border-radius:18px;display:grid;place-items:center;font-size:26px;}
  .i-warm{background:var(--apricot-soft)} .i-sand{background:var(--sand-soft)}
  .txt{flex:1;min-width:0}
  .txt b{display:block;font-family:"Jua",sans-serif;font-weight:400;font-size:17px;margin-bottom:2px;}
  .txt span{display:block;color:var(--muted);font-size:13px;}
  .tag{flex:none;font-size:11.5px;font-weight:600;padding:4px 11px;border-radius:999px;background:var(--apricot-soft);color:var(--cocoa);}
  .tag.file{background:var(--sand-soft);color:#8a7248;}
  .arrow{flex:none;color:var(--apricot);font-size:20px;transition:transform .18s;}
  .item:hover .arrow{transform:translateX(4px)}

  .note{margin-top:30px;background:#fff;border-radius:20px;padding:18px 22px;font-size:13px;color:var(--muted);box-shadow:0 10px 30px -22px rgba(120,85,55,.55);}
  .note b{color:var(--ink);font-family:"Jua",sans-serif;font-weight:400;}
  footer{text-align:center;margin-top:34px;color:var(--muted);font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <div class="mascot">
      <svg viewBox="0 -6 120 120" role="img" aria-label="우리집 갈색 푸들">
        <g transform="rotate(-3 60 56)">
          <!-- 늘어진 귀 -->
          <g fill="#b06c3c">
            <circle cx="10" cy="61" r="8.5"/><circle cx="8" cy="72" r="8.5"/><circle cx="14" cy="83" r="8.5"/>
            <circle cx="26" cy="85" r="8.5"/><circle cx="30" cy="71" r="8.5"/><circle cx="28" cy="58" r="8.5"/>
            <ellipse cx="19" cy="70" rx="13" ry="16"/>
            <circle cx="110" cy="61" r="8.5"/><circle cx="112" cy="72" r="8.5"/><circle cx="106" cy="83" r="8.5"/>
            <circle cx="94" cy="85" r="8.5"/><circle cx="90" cy="71" r="8.5"/><circle cx="92" cy="58" r="8.5"/>
            <ellipse cx="101" cy="70" rx="13" ry="16"/>
          </g>

          <!-- 머리 곱슬 -->
          <g fill="#c9814e">
            <circle cx="91" cy="54" r="8.5"/><circle cx="87" cy="68.5" r="8.5"/><circle cx="75.5" cy="79" r="8.5"/>
            <circle cx="60" cy="83" r="8.5"/><circle cx="44.5" cy="79" r="8.5"/><circle cx="33" cy="68.5" r="8.5"/>
            <circle cx="29" cy="54" r="8.5"/><circle cx="33" cy="39.5" r="8.5"/><circle cx="44.5" cy="29" r="8.5"/>
            <circle cx="60" cy="25" r="8.5"/><circle cx="75.5" cy="29" r="8.5"/><circle cx="87" cy="39.5" r="8.5"/>
            <circle cx="50" cy="21" r="7"/><circle cx="61" cy="18" r="7.5"/><circle cx="71" cy="22" r="7"/>
            <ellipse cx="60" cy="54" rx="31" ry="29"/>
          </g>

          <!-- 주둥이 -->
          <ellipse cx="60" cy="69" rx="14.5" ry="11" fill="#d99a68" opacity=".7"/>

          <!-- 볼터치 -->
          <ellipse cx="35" cy="66" rx="6.5" ry="4" fill="#ef9a72" opacity=".32"/>
          <ellipse cx="85" cy="66" rx="6.5" ry="4" fill="#ef9a72" opacity=".32"/>

          <!-- 눈 -->
          <circle cx="46" cy="53" r="6.4" fill="#2a1d19"/>
          <circle cx="74" cy="53" r="6.4" fill="#2a1d19"/>
          <circle cx="48.2" cy="50.4" r="2.5" fill="#fff"/>
          <circle cx="76.2" cy="50.4" r="2.5" fill="#fff"/>
          <circle cx="43.8" cy="55.8" r="1.4" fill="#fff" opacity=".55"/>
          <circle cx="71.8" cy="55.8" r="1.4" fill="#fff" opacity=".55"/>

          <!-- 코 -->
          <ellipse cx="60" cy="64.5" rx="5.6" ry="4.3" fill="#3a2a24"/>
          <ellipse cx="57.9" cy="64.4" rx="1" ry="1.4" fill="#1d1411"/>
          <ellipse cx="62.1" cy="64.4" rx="1" ry="1.4" fill="#1d1411"/>
          <ellipse cx="58.2" cy="62.2" rx="1.8" ry="1" fill="#856a5c" opacity=".55"/>

          <!-- 입 다문 표정 -->
          <path d="M60,68.8 L60,72.2" stroke="#3a2a24" stroke-width="1.7" stroke-linecap="round"/>
          <path d="M54.4,71.8 Q57.2,76.2 60,72.4 Q62.8,76.2 65.6,71.8" fill="none"
                stroke="#3a2a24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>

          <!-- 반짝임 · 하트 -->
          <path class="spk" d="M12,36 l1.8,4.4 4.4,1.8 -4.4,1.8 -1.8,4.4 -1.8,-4.4 -4.4,-1.8 4.4,-1.8 z" fill="#ffd9ae"/>
          <path class="spk s2" d="M107,45.4 C103,42.4 103.4,39 105.6,39 C106.7,39 107,39.9 107,39.9 C107,39.9 107.3,39 108.4,39 C110.6,39 111,42.4 107,45.4 Z" fill="#f0ab84"/>
          <circle class="spk s2" cx="98" cy="26" r="1.8" fill="#ffd9ae"/>
        </g>
      </svg>
    </div>
    <h1>세무 워크샵</h1>
    <p>자주 쓰는 변환기와 양식을 한곳에 모아뒀어요</p>
  </div>

  <div class="grid">
    <a class="item" href="위하고_일반전표_대출상환_변환기.html">
      <div class="ico i-warm">🧾</div>
      <div class="txt">
        <b>위하고 일반전표 대출상환 변환기</b>
        <span>상환 스케줄을 더존위하고 일반전표 양식으로 변환</span>
      </div>
      <div class="tag">도구</div>
      <div class="arrow">›</div>
    </a>

    <a class="item" href="%EB%8D%94%EC%A1%B4%EC%9C%84%ED%95%98%EA%B3%A0%20%EC%9D%BC%EB%B0%98%EC%A0%84%ED%91%9C%EC%9E%85%EB%A0%A5%20%EC%97%91%EC%85%80%20%EC%96%91%EC%8B%9D%20(1).xlsx">
      <div class="ico i-sand">📋</div>
      <div class="txt">
        <b>더존위하고 일반전표입력 엑셀 양식</b>
        <span>업로드용 표준 양식 (.xlsx)</span>
      </div>
      <div class="tag file">양식</div>
      <div class="arrow">›</div>
    </a>
  </div>

  <div class="note">
    <b>메모 ✎</b> &nbsp;변환 결과는 업로드 전에 계정과목·거래처·일자를 한 번 더 확인해 주세요.
  </div>

  <footer>대한세무법인 · 워크샵 폴더</footer>
</div>
</body>
</html>
